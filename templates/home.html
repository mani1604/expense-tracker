{% extends 'base.html' %}

{% block title %}Home - Expense Tracker{% endblock %}

{% block content %}
<div class="card" style="text-align: center; padding: 3rem;">
    <h1>Expense Tracker</h1>
    <p style="color: #888; margin: 1rem 0;">Track your spending. Stay in control.</p>
    {% if session.get('user_id') %}
        <p>Visit Dashboard to view your expenses</p>
    {% else %}
        <a href="{{ url_for('register') }}" class="btn">Get Started</a>
        &nbsp;
        <a href="{{ url_for('login') }}" class="btn" style="background:#1a1a2e; color:white;">
            Login
        </a>
    {% endif %}
</div>
{% endblock %}
